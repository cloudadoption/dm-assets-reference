<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Arial, 'DejaVu Sans', Helvetica, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#1f2430">Where is this image used? (Dynamic Media asset references)</text>
  <text x="40" y="76" font-size="15" fill="#5b6270">The Sites author sends AEM Assets a short note whenever a page starts or stops using a Dynamic Media image.</text>

  <!-- Left zone: customer network -->
  <rect x="40" y="105" width="500" height="430" rx="14" fill="#f4f5f7" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="62" y="136" font-size="16" font-weight="bold" fill="#3b4252">Customer network</text>
  <text x="62" y="156" font-size="13" fill="#5b6270">AEM Sites author: on-prem, AMS or Cloud, often behind a firewall</text>

  <!-- 1 Author -->
  <rect x="70" y="180" width="440" height="88" rx="10" fill="#ffffff" stroke="#c5cad3" stroke-width="1.5"/>
  <circle cx="100" cy="224" r="16" fill="#1473e6"/><text x="100" y="230" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="130" y="214" font-size="17" font-weight="bold" fill="#1f2430">Author</text>
  <text x="130" y="238" font-size="14" fill="#3b4252">Adds, changes or removes an image on a page,</text>
  <text x="130" y="256" font-size="14" fill="#3b4252">then publishes or unpublishes it</text>

  <line x1="290" y1="268" x2="290" y2="292" stroke="#3b4252" stroke-width="2"/><polygon points="283.0,292.0 297.0,292.0 290.0,302.0" fill="#3b4252"/>

  <!-- 2 Tracker -->
  <rect x="70" y="304" width="440" height="110" rx="10" fill="#ffffff" stroke="#1473e6" stroke-width="2"/>
  <circle cx="100" cy="350" r="16" fill="#1473e6"/><text x="100" y="356" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="130" y="336" font-size="17" font-weight="bold" fill="#1f2430">Reference Tracker</text>
  <text x="130" y="360" font-size="14" fill="#3b4252">Notices the change and records which images</text>
  <text x="130" y="378" font-size="14" fill="#3b4252">the page uses: in the draft and on the live site</text>
  <text x="130" y="400" font-size="13" fill="#5b6270" font-style="italic">Keeps its own notebook so nothing is lost</text>

  <!-- Nightly check -->
  <rect x="70" y="440" width="440" height="70" rx="10" fill="#fffbea" stroke="#e0b000" stroke-width="1.5"/>
  <text x="96" y="470" font-size="15" font-weight="bold" fill="#5c4700">Nightly double-check</text>
  <text x="96" y="492" font-size="13" fill="#5c4700">Re-reads recently changed pages and fixes anything missed</text>
  <line x1="290" y1="440" x2="290" y2="426" stroke="#b38f00" stroke-width="2"/><polygon points="283.0,426.0 297.0,426.0 290.0,416.0" fill="#b38f00"/>

  <!-- Middle arrow -->
  <line x1="512" y1="360" x2="674" y2="360" stroke="#1473e6" stroke-width="4"/><polygon points="674.0,350.0 674.0,370.0 688.0,360.0" fill="#1473e6"/>
  <circle cx="600" cy="320" r="16" fill="#1473e6"/><text x="600" y="326" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="600" y="392" font-size="14" font-weight="bold" fill="#1473e6" text-anchor="middle">Short update</text>
  <text x="600" y="411" font-size="13" fill="#3b4252" text-anchor="middle">every ~30 seconds</text>
  <text x="600" y="429" font-size="13" fill="#3b4252" text-anchor="middle">outgoing only, secure</text>

  <!-- Right zone: Adobe cloud -->
  <rect x="690" y="105" width="470" height="430" rx="14" fill="#eef5ff" stroke="#1473e6" stroke-width="2"/>
  <text x="712" y="136" font-size="16" font-weight="bold" fill="#0d4fa8">Adobe Cloud</text>
  <text x="712" y="156" font-size="13" fill="#3b5f8f">AEM Assets (where the Dynamic Media images live)</text>

  <!-- 4 Receiver -->
  <rect x="720" y="180" width="410" height="100" rx="10" fill="#ffffff" stroke="#1473e6" stroke-width="2"/>
  <circle cx="750" cy="226" r="16" fill="#1473e6"/><text x="750" y="232" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <text x="780" y="212" font-size="17" font-weight="bold" fill="#1f2430">Reference Receiver</text>
  <text x="780" y="236" font-size="14" fill="#3b4252">Checks the sender is allowed, then records</text>
  <text x="780" y="254" font-size="14" fill="#3b4252">that page X uses image Y</text>

  <line x1="925" y1="280" x2="925" y2="304" stroke="#3b4252" stroke-width="2"/><polygon points="918.0,304.0 932.0,304.0 925.0,314.0" fill="#3b4252"/>

  <!-- Index -->
  <rect x="720" y="316" width="410" height="84" rx="10" fill="#ffffff" stroke="#c5cad3" stroke-width="1.5"/>
  <text x="750" y="348" font-size="17" font-weight="bold" fill="#1f2430">Reference index</text>
  <text x="750" y="372" font-size="14" fill="#3b4252">One card per image, listing every page</text>
  <text x="750" y="390" font-size="14" fill="#3b4252">that uses it (draft, live or both)</text>

  <line x1="925" y1="400" x2="925" y2="424" stroke="#3b4252" stroke-width="2"/><polygon points="918.0,424.0 932.0,424.0 925.0,434.0" fill="#3b4252"/>

  <!-- 5 Asset user -->
  <rect x="720" y="436" width="410" height="80" rx="10" fill="#ffffff" stroke="#c5cad3" stroke-width="1.5"/>
  <circle cx="750" cy="476" r="16" fill="#1473e6"/><text x="750" y="482" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <text x="780" y="466" font-size="17" font-weight="bold" fill="#1f2430">Asset user</text>
  <text x="780" y="490" font-size="14" fill="#3b4252">Opens an image and sees the pages using it</text>

  <!-- Example strip -->
  <rect x="40" y="560" width="1120" height="128" rx="12" fill="#f0faf3" stroke="#2d9d78" stroke-width="1.5"/>
  <text x="62" y="592" font-size="16" font-weight="bold" fill="#1d6b51">Example</text>
  <text x="62" y="620" font-size="14" font-weight="bold" fill="#1f2430">10:00:00</text><text x="160" y="620" font-size="14" fill="#1f2430">Maria adds summer-hero.jpg to the Summer Sale page and publishes it.</text>
  <text x="62" y="644" font-size="14" font-weight="bold" fill="#1f2430">10:00:30</text><text x="160" y="644" font-size="14" fill="#1f2430">In AEM Assets, summer-hero.jpg shows: Used on /us/en/summer-sale (live).</text>
  <text x="62" y="668" font-size="14" font-weight="bold" fill="#1f2430">Next week</text><text x="160" y="668" font-size="14" fill="#1f2430">Maria swaps the image. Within a minute summer-hero.jpg no longer lists that page.</text>
</svg>
